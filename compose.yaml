services:
  bot:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    image: ${BOT_IMAGE:-max-hackathon-bot:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-ЖКХ Контроль}
      APP_VERSION: ${APP_VERSION:-local}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?MAX_BOT_TOKEN is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:?MAX_WEBHOOK_SECRET is required}
      INITIAL_ADMIN_MAX_USER_ID: ${INITIAL_ADMIN_MAX_USER_ID:?INITIAL_ADMIN_MAX_USER_ID is required}
      INVITE_CODE_TTL: ${INVITE_CODE_TTL:-24h}
      TARANTOOL_ADDRESS: ${TARANTOOL_ADDRESS:-tarantool:3301}
      TARANTOOL_USER: ${TARANTOOL_USER:-app}
      TARANTOOL_PASSWORD: ${TARANTOOL_PASSWORD:?TARANTOOL_PASSWORD is required}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-seaweedfs:8333}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-work-evidence}
      MESSAGE_BROKER_URL: ${MESSAGE_BROKER_URL:-nats://nats:4222}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      POLZA_AI_BASE_URL: ${POLZA_AI_BASE_URL:-https://polza.ai/api/v1}
      POLZA_AI_API_KEY: ${POLZA_AI_API_KEY:-}
      POLZA_AI_MODEL: ${POLZA_AI_MODEL:-openai/gpt-4o}
      POLZA_AI_TIMEOUT: ${POLZA_AI_TIMEOUT:-45s}
      POLZA_AI_MAX_TOKENS: ${POLZA_AI_MAX_TOKENS:-800}
      POLZA_AI_MAX_IMAGES: ${POLZA_AI_MAX_IMAGES:-4}
      POLZA_AI_MAX_IMAGE_BYTES: ${POLZA_AI_MAX_IMAGE_BYTES:-8388608}
      POLZA_AI_IMAGE_DETAIL: ${POLZA_AI_IMAGE_DETAIL:-high}
      POLZA_AI_ALLOW_FALLBACKS: ${POLZA_AI_ALLOW_FALLBACKS:-true}
      POLZA_AI_MAX_PRICE_RUB: ${POLZA_AI_MAX_PRICE_RUB:-10}
      POLZA_AI_PROVIDER_ONLY: ${POLZA_AI_PROVIDER_ONLY:-}
      POLZA_AI_PROMPT_VERSION: ${POLZA_AI_PROMPT_VERSION:-v1}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
    depends_on:
      - tarantool
      - seaweedfs
      - nats

  tarantool:
    image: ${TARANTOOL_IMAGE:-tarantool/tarantool:3.4}
    restart: unless-stopped
    command: ["tarantool", "/opt/tarantool/init.lua"]
    environment:
      TARANTOOL_USER: ${TARANTOOL_USER:-app}
      TARANTOOL_PASSWORD: ${TARANTOOL_PASSWORD:?TARANTOOL_PASSWORD is required}
      INITIAL_ADMIN_MAX_USER_ID: ${INITIAL_ADMIN_MAX_USER_ID:?INITIAL_ADMIN_MAX_USER_ID is required}
    volumes:
      - tarantool_data:/var/lib/tarantool
      - ./infra/tarantool/init.lua:/opt/tarantool/init.lua:ro
    expose:
      - "3301"

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET:-work-evidence}
    volumes:
      - seaweedfs_data:/data
    expose:
      - "8333"

  nats:
    image: ${NATS_IMAGE:-nats:2.11-alpine}
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats_data:/data
    expose:
      - "4222"

  # Enable this profile after the domain is pointed at the VPS. Caddy obtains
  # and renews TLS, serves the frontend, and proxies /api to the Go service.
  caddy:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    image: ${FRONTEND_IMAGE:-max-hackathon-frontend:local}
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  caddy_data:
  caddy_config:
  tarantool_data:
  seaweedfs_data:
  nats_data:
