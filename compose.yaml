services:
  bot:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    image: ${BOT_IMAGE:-max-hackathon-bot:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?MAX_BOT_TOKEN is required}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s

  # Enable this profile after the domain is pointed at the VPS. Caddy obtains
  # and renews TLS, serves the frontend, and proxies /api to the Go service.
  caddy:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    image: ${FRONTEND_IMAGE:-max-hackathon-frontend:local}
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot

volumes:
  caddy_data:
  caddy_config:
