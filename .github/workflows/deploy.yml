name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # GHCR/Docker image references must be lowercase. The GitHub owner is
  # currently GusevCode, so keep the registry path normalized explicitly.
  IMAGE_NAME: ghcr.io/gusevcode/max-hackathon-echo-bot
  FRONTEND_IMAGE: ghcr.io/gusevcode/max-hackathon-frontend

jobs:
  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.revision.outputs.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: true
          build-args: |
            VITE_MAX_BOT_URL=${{ vars.MAX_BOT_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.revision.outputs.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Configure known host
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.VPS_KNOWN_HOSTS }}' >> ~/.ssh/known_hosts

      - name: Copy deployment files
        shell: bash
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${{ secrets.VPS_APP_DIR }}/infra/caddy' '${{ secrets.VPS_APP_DIR }}/infra/tarantool'"
          scp compose.yaml "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/compose.yaml"
          scp infra/caddy/Caddyfile "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/infra/caddy/Caddyfile"
          scp infra/tarantool/init.lua "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/infra/tarantool/init.lua"

      - name: Pull and restart service
        shell: bash
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "export BOT_IMAGE='${{ env.IMAGE_NAME }}:${{ steps.revision.outputs.sha }}'; \
             export FRONTEND_IMAGE='${{ env.FRONTEND_IMAGE }}:${{ steps.revision.outputs.sha }}'; \
             export APP_VERSION='${{ steps.revision.outputs.sha }}'; \
             export COMPOSE_PROJECT_NAME='max-hackathon'; \
             echo '${{ secrets.GHCR_READ_TOKEN }}' | docker login ghcr.io --username '${{ secrets.GHCR_USERNAME }}' --password-stdin; \
             cd '${{ secrets.VPS_APP_DIR }}'; \
             docker compose --profile https pull bot caddy tarantool minio; \
             docker compose --profile https up -d --force-recreate --remove-orphans bot caddy; \
             docker image prune -f"

      - name: Verify deployed revision
        shell: bash
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "export BOT_IMAGE='${{ env.IMAGE_NAME }}:${{ steps.revision.outputs.sha }}'; \
             export FRONTEND_IMAGE='${{ env.FRONTEND_IMAGE }}:${{ steps.revision.outputs.sha }}'; \
             export APP_VERSION='${{ steps.revision.outputs.sha }}'; \
             export COMPOSE_PROJECT_NAME='max-hackathon'; \
             cd '${{ secrets.VPS_APP_DIR }}'; \
             docker compose images bot caddy; \
             docker compose logs --tail=30 bot; \
             docker compose exec -T bot wget -S -O- http://127.0.0.1:8080/api/version"

          expected='${{ steps.revision.outputs.sha }}'
          actual="$(curl --fail --silent --show-error https://max.conspiracy-team.ru/api/version | jq -r '.version')"
          echo "Expected revision: ${expected}"
          echo "Running revision:  ${actual}"
          test "${actual}" = "${expected}"
