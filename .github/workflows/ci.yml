name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go tests and lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/backend/go.mod
          cache: true
          cache-dependency-path: src/backend/go.sum

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ github.sha }}
          path: src/backend/coverage.out
          if-no-files-found: error

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          working-directory: src/backend
          args: --config ../../.golangci.yml ./...

  docker:
    name: Build Docker image
    runs-on: ubuntu-24.04
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --file infra/docker/backend.Dockerfile --tag max-hackathon-bot:${{ github.sha }} .
